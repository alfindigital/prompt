  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://promlib.lovable.app/#website",
          "url": "https://promlib.lovable.app/",
          "name": "Promptly",
          "description": "A personal AI prompt library — save, organize, search, and reuse your favorite prompts.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://promlib.lovable.app/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "WebApplication",
          "@id": "https://promlib.lovable.app/#webapp",
          "name": "Promptly — AI Prompt Library",
          "url": "https://promlib.lovable.app/",
          "description": "Local-first AI prompt library. Save, tag, categorize, search, favorite, duplicate, and share reusable prompts in your browser.",
          "applicationCategory": "ProductivityApplication",
          "operatingSystem": "Any",
          "browserRequirements": "Requires JavaScript and a modern browser",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "featureList": [
            "Save and organize AI prompts",
            "Tag and categorize prompts",
            "Full-text search and filters",
            "Reusable {{variables}} with fill-in",
            "Favorites and duplication",
            "Version history",
            "Import/export JSON",
            "Markdown preview",
            "Command palette (Ctrl/Cmd+K)",
            "Share prompts via link",
            "Installable, offline-ready PWA"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://promlib.lovable.app/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is Promptly free?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. Promptly is completely free with no sign-up. Your prompts are stored locally in your browser." }
            },
            {
              "@type": "Question",
              "name": "Where are my prompts stored?",
              "acceptedAnswer": { "@type": "Answer", "text": "Everything is saved in your browser's local storage. Nothing is sent to a server. Export a backup any time to move between devices." }
            },
            {
              "@type": "Question",
              "name": "Can I use variables in prompts?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. Add {{placeholders}} to any prompt and Promptly will ask you to fill them in before copying." }
            }
          ]
        }
      ]
    }
  </script>
  <script>
    // Apply saved/system theme before paint to avoid a flash and persist dark mode across reloads.
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var dark = stored === "dark" || (!stored && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
</head>

      </div>
    </noscript>
